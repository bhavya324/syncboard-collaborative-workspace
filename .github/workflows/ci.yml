name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm install
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client
